<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Space Neon Shooter</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            user-select: none;
        }
        body {
            background: #020208;
            color: #fff;
            font-family: 'Segoe UI', sans-serif;
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }
        #gameCanvas {
            border: 2px solid #00f2fe;
            box-shadow: 0 0 30px rgba(0, 242, 254, 0.3);
            background: #050515;
        }
        .ui-container {
            position: absolute;
            top: 20px;
            left: 50%;
            transform: translateX(-50%);
            text-align: center;
            pointer-events: none;
            z-index: 10;
        }
        .score {
            font-size: 2rem;
            font-weight: bold;
            color: #00f2fe;
            text-shadow: 0 0 10px rgba(0, 242, 254, 0.8);
        }
        .controls-hint {
            position: absolute;
            bottom: 20px;
            color: rgba(255, 255, 255, 0.5);
            font-size: 0.9rem;
            text-align: center;
            width: 100%;
            pointer-events: none;
        }
        .game-over-screen {
            position: absolute;
            display: none;
            flex-direction: column;
            align-items: center;
            background: rgba(5, 5, 21, 0.95);
            padding: 40px;
            border-radius: 16px;
            border: 1px solid #ff007f;
            box-shadow: 0 0 40px rgba(255, 0, 127, 0.4);
            text-align: center;
            z-index: 20;
        }
        .game-over-screen h2 {
            font-size: 3rem;
            color: #ff007f;
            text-shadow: 0 0 15px rgba(255, 0, 127, 0.8);
            margin-bottom: 20px;
        }
        .restart-btn {
            margin-top: 20px;
            padding: 12px 30px;
            font-size: 1.2rem;
            background: linear-gradient(45deg, #00f2fe, #4facfe);
            border: none;
            color: #000;
            font-weight: bold;
            border-radius: 8px;
            cursor: pointer;
            transition: transform 0.2s;
            pointer-events: auto;
        }
        .restart-btn:hover {
            transform: scale(1.05);
        }
    </style>
</head>
<body>

    <div class="ui-container">
        <div class="score" id="scoreDisplay">SCORE: 0</div>
    </div>

    <canvas id="gameCanvas" width="480" height="640"></canvas>

    <div class="game-over-screen" id="gameOverScreen">
        <h2>GAME OVER</h2>
        <div class="score" id="finalScoreDisplay">SCORE: 0</div>
        <button class="restart-btn" id="restartBtn">Qaytadan boshlash</button>
    </div>

    <div class="controls-hint">Boshqarish: Sichqonchani suring (kema ergashadi) va chap tugmani bosing (otish)</div>

    <script>
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        const scoreDisplay = document.getElementById('scoreDisplay');
        const finalScoreDisplay = document.getElementById('finalScoreDisplay');
        const gameOverScreen = document.getElementById('gameOverScreen');
        const restartBtn = document.getElementById('restartBtn');

        let score = 0;
        let isGameOver = false;

        const player = {
            x: 220,
            y: 560,
            width: 40,
            height: 40,
            color: '#00f2fe'
        };

        let lasers = [];
        let asteroids = [];
        let particles = [];
        let stars = [];

       
        for (let i = 0; i < 30; i++) {
            stars.push({
                x: Math.random() * canvas.width,
                y: Math.random() * canvas.height,
                size: Math.random() * 2 + 1,
                speed: Math.random() * 1 + 0.5
            });
        }

      
        canvas.addEventListener('mousemove', (e) => {
            const rect = canvas.getBoundingClientRect();
            player.x = e.clientX - rect.left - player.width / 2;
            if (player.x < 0) player.x = 0;
            if (player.x > canvas.width - player.width) player.x = canvas.width - player.width;
        });

        canvas.addEventListener('click', () => {
            if (isGameOver) return;
            lasers.push({
                x: player.x + player.width / 2 - 3,
                y: player.y,
                width: 6,
                height: 15,
                color: '#ff007f',
                speed: 8
            });
        });

        function createParticles(x, y, color) {
            for (let i = 0; i < 8; i++) {
                particles.push({
                    x: x,
                    y: y,
                    radius: Math.random() * 3 + 1,
                    color: color,
                    speedX: (Math.random() - 0.5) * 4,
                    speedY: (Math.random() - 0.5) * 4,
                    alpha: 1
                });
            }
        }

        let spawnInterval;
        function startSpawning() {
            clearInterval(spawnInterval);
            spawnInterval = setInterval(() => {
                if (isGameOver) return;
                const size = Math.random() * 20 + 20;
                asteroids.push({
                    x: Math.random() * (canvas.width - size),
                    y: -size,
                    width: size,
                    height: size,
                    color: '#00ff66',
                    speed: Math.random() * 2 + 1
                });
            }, 1000);
        }

        function rectIntersect(rect1, rect2) {
            return rect1.x < rect2.x + rect2.width &&
                   rect1.x + rect1.width > rect2.x &&
                   rect1.y < rect2.y + rect2.height &&
                   rect1.y + rect1.height > rect2.y;
        }

        function update() {
            if (isGameOver) return;

            stars.forEach(star => {
                star.y += star.speed;
                if (star.y > canvas.height) star.y = 0;
            });

            lasers.forEach((laser, index) => {
                laser.y -= laser.speed;
                if (laser.y < 0) lasers.splice(index, 1);
            });

            for (let aIndex = asteroids.length - 1; aIndex >= 0; aIndex--) {
                let asteroid = asteroids[aIndex];
                asteroid.y += asteroid.speed;

                if (rectIntersect(player, asteroid)) {
                    isGameOver = true;
                    clearInterval(spawnInterval);
                    finalScoreDisplay.textContent = "SCORE: " + score;
                    gameOverScreen.style.display = 'flex';
                    break;
                }

                if (asteroid.y > canvas.height) {
                    asteroids.splice(aIndex, 1);
                    continue;
                }

                for (let lIndex = lasers.length - 1; lIndex >= 0; lIndex--) {
                    let laser = lasers[lIndex];
                    if (rectIntersect(laser, asteroid)) {
                        createParticles(asteroid.x + asteroid.width/2, asteroid.y + asteroid.height/2, '#00ff66');
                        asteroids.splice(aIndex, 1);
                        lasers.splice(lIndex, 1);
                        score += 10;
                        scoreDisplay.textContent = "SCORE: " + score;
                        break;
                    }
                }
            }

            particles.forEach((p, index) => {
                p.x += p.speedX;
                p.y += p.speedY;
                p.alpha -= 0.03;
                if (p.alpha <= 0) particles.splice(index, 1);
            });
        }

        function draw() {
            ctx.fillStyle = '#050515';
            ctx.fillRect(0, 0, canvas.width, canvas.height);

   
            ctx.fillStyle = '#ffffff';
            stars.forEach(star => {
                ctx.fillRect(star.x, star.y, star.size, star.size);
            });

          
            ctx.fillStyle = player.color;
            ctx.beginPath();
            ctx.moveTo(player.x + player.width / 2, player.y);
            ctx.lineTo(player.x, player.y + player.height);
            ctx.lineTo(player.x + player.width, player.y + player.height);
            ctx.closePath();
            ctx.fill();

            ctx.fillStyle = '#ff007f';
            lasers.forEach(laser => {
                ctx.fillRect(laser.x, laser.y, laser.width, laser.height);
            });

           
            ctx.fillStyle = '#00ff66';
            asteroids.forEach(asteroid => {
                ctx.beginPath();
                ctx.arc(asteroid.x + asteroid.width/2, asteroid.y + asteroid.height/2, asteroid.width/2, 0, Math.PI * 2);
                ctx.fill();
            });

            particles.forEach(p => {
                ctx.save();
                ctx.globalAlpha = p.alpha;
                ctx.fillStyle = p.color;
                ctx.beginPath();
                ctx.arc(p.x, p.y, p.radius, 0, Math.PI * 2);
                ctx.fill();
                ctx.restore();
            });
        }

        function gameLoop() {
            update();
            draw();
            requestAnimationFrame(gameLoop);
        }

        function resetGame() {
            score = 0;
            isGameOver = false;
            lasers = [];
            asteroids = [];
            particles = [];
            player.x = 220;
            player.y = 560;
            scoreDisplay.textContent = "SCORE: 0";
gameOverScreen.style.display = 'none';
startSpawning();
}
restartBtn.addEventListener('click', resetGame);
startSpawning();
gameLoop();
